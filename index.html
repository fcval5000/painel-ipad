<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070B1F">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Notícias">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Painel de Notícias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============ druris-neon (mesma paleta dos dashboards do Home Assistant) ============ */
:root{
  --amb:#FFB020; --azul:#38BDF8; --vio:#8B5CF6; --vio2:#A78BFA; --car:#FF3B5C; --menta:#34E3A4; --lav:#A5B4FC; --amar:#FACC15;
  --txt:#F5F7FF; --txt2:#C7CBE8; --dim:#8A90C0;
  --noite:#121840; --borda:#262D63; --fundo:#070B1F;
  --card:rgba(18,24,64,.58); --card2:rgba(12,18,52,.82);
  --r:1.35rem; --gap:1rem; --pad:1.25rem;
  --accent:var(--azul);
  --interval:14s;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  /* escala única: tudo em rem acompanha o tamanho da tela (iPad, TV, celular) */
  font-size:clamp(14px, min(1.22vw, 2.05vh), 42px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--fundo);
  color:var(--txt);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-feature-settings:"tnum" 1,"cv11" 1;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  overflow:hidden;
  user-select:none; -webkit-user-select:none;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:.18rem solid var(--azul);outline-offset:.18rem;border-radius:.6rem}
svg{display:block}

/* ---------- fundo neon ---------- */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;
  background:
    radial-gradient(ellipse 70% 55% at 8% -6%, rgba(99,102,241,.42), transparent 70%),
    radial-gradient(ellipse 45% 50% at 106% 22%, rgba(34,211,238,.18), transparent 70%),
    radial-gradient(ellipse 70% 45% at 55% 112%, rgba(139,92,246,.28), transparent 70%),
    linear-gradient(180deg,#070B1F 0%,#0A0F2C 55%,#060818 100%);}
.bg svg{position:absolute;left:0;right:0;bottom:0;width:100%;height:46%;opacity:.75}
.bg path{fill:none;filter:url(#strandGlow)}

/* ---------- layout ---------- */
.app{
  height:100vh; height:100dvh;
  padding:calc(var(--gap) + var(--safe-t)) calc(var(--gap) + var(--safe-r)) calc(var(--gap) + var(--safe-b)) calc(var(--gap) + var(--safe-l));
  display:grid; gap:var(--gap);
  grid-template-columns:minmax(0,1fr) 24rem;
  grid-template-rows:auto minmax(0,1fr);
  grid-template-areas:"top side" "hero side";
}
.top{grid-area:top}
.hero{grid-area:hero}
.side{grid-area:side;display:flex;flex-direction:column;gap:var(--gap);min-height:0}
.mhead{display:contents}

.card{
  background:var(--card);
  border:.11rem solid var(--borda);
  border-radius:var(--r);
  backdrop-filter:blur(18px) saturate(140%); -webkit-backdrop-filter:blur(18px) saturate(140%);
  box-shadow:0 .6rem 2rem rgba(3,6,24,.45), inset 0 1px 0 rgba(255,255,255,.04);
}
.label{font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}

/* ---------- barra superior ---------- */
.top{display:flex;align-items:center;gap:.8rem;min-width:0}
.chips{display:flex;gap:.5rem;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;padding:.15rem}
.chips::-webkit-scrollbar{display:none}
.chips{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 2.5rem),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 2.5rem),transparent);padding-right:2.5rem}
.chip{
  --c:var(--azul);
  flex:none;display:flex;align-items:center;gap:.45rem;
  padding:.42rem .85rem;border-radius:99rem;
  font-size:.82rem;font-weight:600;color:var(--txt2);
  background:rgba(18,24,64,.55);border:.09rem solid var(--borda);
  transition:background .2s,border-color .2s,color .2s,opacity .2s;
}
.chip i{width:.55rem;height:.55rem;border-radius:50%;background:var(--c);box-shadow:0 0 .5rem var(--c)}
.chip[aria-pressed="true"]{color:var(--txt);border-color:color-mix(in srgb,var(--c) 55%,var(--borda));background:color-mix(in srgb,var(--c) 16%,rgba(18,24,64,.7))}
.chip[aria-pressed="false"]{opacity:.5}
.chip[aria-pressed="false"] i{box-shadow:none;background:var(--dim)}
.status{flex:none;display:flex;align-items:center;gap:.5rem;font-size:.8rem;color:var(--dim);white-space:nowrap}
.status .dot{width:.5rem;height:.5rem;border-radius:50%;background:var(--menta);box-shadow:0 0 .6rem var(--menta)}
.status.warn .dot{background:var(--amb);box-shadow:0 0 .6rem var(--amb)}
.status.err .dot{background:var(--car);box-shadow:0 0 .6rem var(--car)}

/* ---------- relógio ---------- */
.clock{padding:var(--pad) calc(var(--pad) + .2rem)}
.clock .date{font-size:.85rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--azul)}
.clock .time{font-size:4.6rem;font-weight:300;line-height:1;letter-spacing:-.04em;margin:.35rem 0 .3rem;font-variant-numeric:tabular-nums}
.clock .time b{font-weight:300;animation:blink 2s steps(1) infinite}
.clock .greet{font-size:1.15rem;font-weight:600;color:var(--txt)}
@keyframes blink{50%{opacity:.25}}

/* ---------- clima ---------- */
.weather{padding:var(--pad)}
.w-now{display:flex;align-items:center;gap:.6rem}
.w-now .ico{width:5.2rem;height:5.2rem;flex:none;margin:-.6rem -.2rem -.6rem -.5rem}
.w-now .t{font-size:3rem;font-weight:300;letter-spacing:-.03em;line-height:1}
.w-now .t sup{font-size:.45em;vertical-align:.9em;color:var(--txt2);margin-left:.05em}
.w-now .cond{font-size:.95rem;font-weight:600;color:var(--lav);margin-top:.3rem}
.w-now .feel{font-size:.78rem;color:var(--dim);margin-top:.15rem}
.w-now .city{margin-left:auto;align-self:flex-start;text-align:right}
.w-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;margin:1rem 0 .9rem;padding:.65rem .4rem;border-radius:1rem;background:rgba(8,12,38,.5);border:.08rem solid rgba(38,45,99,.7)}
.w-stats div{display:flex;flex-direction:column;align-items:center;gap:.2rem;font-size:.85rem;font-weight:600}
.w-stats svg{width:1.1rem;height:1.1rem}
.w-days{display:grid;grid-template-columns:repeat(5,1fr);gap:.2rem}
.w-day{display:flex;flex-direction:column;align-items:center;gap:.1rem;font-size:.78rem}
.w-day .n{font-weight:700;color:var(--txt2)}
.w-day .ico{width:2.3rem;height:2.3rem}
.w-day .mx{font-weight:700}
.w-day .mn{color:var(--dim)}
.w-day .pp{font-size:.66rem;color:var(--azul);min-height:1em}

/* ---------- a seguir ---------- */
.next{padding:var(--pad) .7rem .7rem;display:flex;flex-direction:column;min-height:0;flex:1}
.next .label{padding:0 .55rem .55rem}
.next-list{display:flex;flex-direction:column;gap:.35rem;overflow:hidden;min-height:0;flex:1}
.ni{display:flex;gap:.7rem;align-items:center;padding:.45rem .55rem;border-radius:1rem;text-align:left;transition:background .2s;width:100%}
.ni:hover{background:rgba(56,189,248,.08)}
.ni .th{flex:none;width:4.4rem;height:3.1rem;border-radius:.7rem;overflow:hidden;background:var(--noite);position:relative}
.ni .th img{width:100%;height:100%;object-fit:cover}
.ni .tx{min-width:0;flex:1}
.ni .s{display:flex;align-items:center;gap:.35rem;font-size:.68rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--c,var(--dim))}
.ni .s span{color:var(--dim);font-weight:500;text-transform:none;letter-spacing:0}
.ni .h{font-size:.86rem;font-weight:600;line-height:1.28;color:var(--txt);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:.12rem}

/* ---------- destaque ---------- */
.hero{position:relative;overflow:hidden;padding:0;isolation:isolate;min-height:0}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .9s ease;display:block}
.slide.on{opacity:1}
.slide .blur{position:absolute;inset:-8%;width:116%;height:116%;object-fit:cover;filter:blur(40px) saturate(150%) brightness(.55);transform:scale(1.1)}
.slide .pic{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:60% 40%}
.slide.on .pic{animation:kb calc(var(--interval) + 2s) ease-out forwards}
.slide.contain .pic{object-fit:contain}
@keyframes kb{from{transform:scale(1.0)}to{transform:scale(1.07)}}
.slide .ph{position:absolute;inset:0;display:grid;place-items:center;
  background:radial-gradient(circle at 30% 30%,color-mix(in srgb,var(--c) 45%,transparent),transparent 60%),radial-gradient(circle at 80% 80%,rgba(139,92,246,.35),transparent 55%),var(--noite)}
.slide .ph span{font-size:5rem;font-weight:800;letter-spacing:-.04em;color:rgba(245,247,255,.12)}
.slide .scrim{position:absolute;inset:0;background:
  linear-gradient(180deg,rgba(7,11,31,.55) 0%,rgba(7,11,31,0) 20%,rgba(7,11,31,0) 30%,rgba(7,11,31,.6) 48%,rgba(7,11,31,.9) 66%,rgba(7,11,31,.97) 100%)}
.slide .body{position:absolute;left:0;right:0;bottom:0;padding:2rem 2.2rem 2.4rem;max-width:62rem}
.meta{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:.9rem}
.pill{display:inline-flex;align-items:center;gap:.45rem;padding:.36rem .85rem;border-radius:99rem;font-size:.8rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  color:#0A0F2C;background:var(--c);box-shadow:0 0 1.2rem color-mix(in srgb,var(--c) 55%,transparent)}
.meta .cat,.meta .ago{font-size:.85rem;font-weight:600;color:var(--txt2);text-shadow:0 1px .6rem rgba(0,0,0,.7)}
.meta .ago::before{content:"•";margin-right:.6rem;color:var(--dim)}
.slide h1{font-size:2.55rem;font-weight:800;line-height:1.12;letter-spacing:-.025em;text-wrap:balance;
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 .1rem 1.5rem rgba(0,0,0,.45)}
.slide p{font-size:1.15rem;line-height:1.5;color:var(--txt2);margin-top:.85rem;max-width:52rem;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

.hud{position:absolute;top:1.1rem;right:1.1rem;display:flex;gap:.5rem;z-index:3}
.hud button{width:2.9rem;height:2.9rem;border-radius:50%;display:grid;place-items:center;
  background:rgba(12,18,52,.55);border:.09rem solid rgba(165,180,252,.25);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:background .2s,transform .15s}
.hud button:hover{background:rgba(56,189,248,.35)}
.hud button:active{transform:scale(.92)}
.hud svg{width:1.3rem;height:1.3rem}
.counter{position:absolute;top:1.1rem;left:1.2rem;z-index:3;font-size:.8rem;font-weight:700;color:var(--txt2);
  padding:.4rem .75rem;border-radius:99rem;background:rgba(12,18,52,.55);border:.09rem solid rgba(165,180,252,.2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.counter .pz{display:none;color:var(--amb);margin-left:.4rem}
.paused .counter .pz{display:inline}
.prog{position:absolute;left:0;right:0;bottom:0;height:.28rem;background:rgba(255,255,255,.06);z-index:3}
.prog i{display:block;height:100%;width:100%;transform-origin:left;transform:scaleX(0);background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 50%,#fff));box-shadow:0 0 .8rem var(--accent)}
.prog i.run{animation:prog var(--interval) linear forwards}
.paused .prog i{animation-play-state:paused}
@keyframes prog{to{transform:scaleX(1)}}

.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:2rem;color:var(--txt2)}
.empty h2{font-size:1.6rem;font-weight:700;color:var(--txt);margin-bottom:.4rem}
.spinner{width:3rem;height:3rem;margin:0 auto 1.2rem;border-radius:50%;border:.25rem solid rgba(165,180,252,.18);border-top-color:var(--azul);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- modo noturno (escurece a tela de madrugada) ---------- */
.dim{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity 2s;z-index:50}
body.night .dim{opacity:.6}

/* ============ retrato (iPad/tablet em pé) ============ */
@media (orientation:portrait) and (min-width:600px){
  :root{font-size:clamp(14px, min(2.05vw, 1.55vh), 40px)}
  .app{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);grid-template-rows:auto auto minmax(0,1fr) auto;
       grid-template-areas:"top top" "clock weather" "hero hero" "next next"}
  .side{display:contents}
  .clock{grid-area:clock;display:flex;flex-direction:column;justify-content:center}
  .weather{grid-area:weather}
  .next{grid-area:next;flex:none}
  .next-list{flex-direction:row;gap:.6rem}
  .next-list .ni{flex:1;min-width:0;flex-direction:column;align-items:stretch;padding:.4rem}
  .next-list .ni .th{width:100%;height:auto;aspect-ratio:16/9}
  .next-list .ni:nth-child(n+4){display:none}
  .w-stats{margin:.8rem 0 .7rem}
}

/* ============ celular ============ */
@media (max-width:599px){
  :root{font-size:15px;--gap:.75rem;--pad:1rem;--r:1.25rem}
  body{overflow:auto}
  .app{height:auto;min-height:100dvh;grid-template-columns:minmax(0,1fr);grid-template-rows:none;
       grid-template-areas:"top" "head" "hero" "next"}
  .top{order:0}
  .side{display:contents}
  .mhead{grid-area:head;display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:var(--gap)}
  .clock{padding:1rem}
  .clock .time{font-size:3.2rem}
  .clock .greet{font-size:1rem}
  .weather{padding:1rem}
  .w-now .ico{width:3.8rem;height:3.8rem}
  .w-now .t{font-size:2.3rem}
  .w-now .city,.w-now .feel{display:none}
  .w-stats{display:none}
  .w-days{margin-top:.6rem}
  .w-day .ico{width:1.9rem;height:1.9rem}
  .w-day .pp{display:none}
  .clock .date{font-size:.7rem}
  .w-days{grid-template-columns:repeat(3,1fr)}
  .w-day:nth-child(n+4){display:none}
  .w-day{font-size:.72rem;white-space:nowrap}
  .hero{height:auto;aspect-ratio:4/5;max-height:78dvh}
  .slide .body{padding:1.2rem 1.2rem 1.5rem}
  .slide h1{font-size:1.55rem;-webkit-line-clamp:5}
  .slide p{font-size:.98rem;-webkit-line-clamp:3}
  .hud{top:.8rem;right:.8rem}
  .counter{top:.8rem;left:.8rem}
  .next{flex:none}
  .next-list{overflow:visible}
  .ni .th{width:5.4rem;height:3.8rem}
  .ni .h{font-size:.95rem;-webkit-line-clamp:3}
  .status .txt{display:none}
}
@media (max-width:380px){
  .mhead{grid-template-columns:1fr}
}
/* tela baixa em paisagem (celular deitado) */
@media (orientation:landscape) and (max-height:500px){
  :root{font-size:clamp(11px,1.6vh + .6vw,16px);--gap:.6rem;--pad:.9rem}
  .app{grid-template-columns:minmax(0,1fr) 20rem}
  .clock .time{font-size:3.2rem}
  .w-stats,.w-days .pp{display:none}
  .next{display:none}
}
@media (hover:none){ .ni:hover,.hud button:hover{background:inherit} }
@media (prefers-reduced-motion:reduce){
  .slide.on .pic{animation:none}
  .clock .time b{animation:none}
}
</style>
</head>
<body>
<!-- defs compartilhadas: ícones do tempo e brilho das linhas neon -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="cl" gradientUnits="userSpaceOnUse" x1="0" y1="34" x2="0" y2="92"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#B8C0F5"/></linearGradient>
    <linearGradient id="cd" gradientUnits="userSpaceOnUse" x1="0" y1="34" x2="0" y2="92"><stop offset="0" stop-color="#D5D9F2"/><stop offset="1" stop-color="#7A82B8"/></linearGradient>
    <radialGradient id="sun" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#FFE7A8"/><stop offset=".55" stop-color="#FFB020"/><stop offset="1" stop-color="#F08A00"/></radialGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EEF0FF"/><stop offset="1" stop-color="#A5B4FC"/></linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur in="SourceGraphic" stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowS" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur in="SourceGraphic" stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6366F1" flood-opacity=".55"/></filter>
    <filter id="strandGlow" x="-5%" y="-50%" width="110%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
</svg>

<div class="bg" aria-hidden="true">
  <svg viewBox="0 0 1000 300" preserveAspectRatio="none" id="strands"></svg>
</div>

<main class="app" id="app">
  <header class="top">
    <nav class="chips" id="chips" aria-label="Fontes"></nav>
    <div class="status" id="status" role="status"><span class="dot"></span><span class="txt">Carregando…</span></div>
  </header>

  <section class="card hero" id="hero" aria-live="polite">
    <div class="empty" id="empty"><div><div class="spinner"></div><h2>Buscando as notícias</h2><div>g1, ge, ESPN, UOL, Canaltech, Tecnoblog…</div></div></div>
    <div class="counter" id="counter" hidden><span id="cnt">0 / 0</span><span class="pz">⏸ pausado</span></div>
    <div class="hud" id="hud" hidden>
      <button id="btnPrev" aria-label="Notícia anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button id="btnPause" aria-label="Pausar"><svg viewBox="0 0 24 24" fill="currentColor" id="icoPause"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg></button>
      <button id="btnNext" aria-label="Próxima notícia"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <div class="prog"><i id="prog"></i></div>
  </section>

  <aside class="side">
    <div class="mhead" id="mhead">
      <section class="card clock">
        <div class="date" id="date">—</div>
        <div class="time" id="time">--<b>:</b>--</div>
        <div class="greet" id="greet">Olá!</div>
      </section>

      <section class="card weather" id="weather">
        <div class="w-now">
          <div class="ico" id="wIco"></div>
          <div>
            <div class="t" id="wTemp">--<sup>°C</sup></div>
            <div class="cond" id="wCond">Carregando clima…</div>
            <div class="feel" id="wFeel"></div>
          </div>
          <div class="city"><div class="label" id="wCity">Campinas</div></div>
        </div>
        <div class="w-stats" id="wStats"></div>
        <div class="w-days" id="wDays"></div>
      </section>
    </div>

    <section class="card next">
      <div class="label">A seguir</div>
      <div class="next-list" id="nextList"></div>
    </section>
  </aside>
</main>
<div class="dim" id="dim"></div>

<script>
'use strict';
/* =================== configuração (pode ser alterada pela URL) ===================
   ?intervalo=14        segundos por notícia
   ?fontes=g1,ge        só essas fontes (ids de feeds.json)
   ?lat=-22.9&lon=-47.06&cidade=Campinas
   ?noturno=0           desliga o escurecimento entre 23h e 6h (ou ?noturno=22-7)
   ?nome=Felipe         saudação personalizada
*/
const Q = new URLSearchParams(location.search);
const CFG = {
  interval: Math.max(5, +Q.get('intervalo') || 14) * 1000,
  lat: +Q.get('lat') || -22.9056,
  lon: +Q.get('lon') || -47.0608,

(function strands() {
  const svg = $('strands');
  const cols = [['#6366F1', 2, .55], ['#22D3EE', 1.5, .45], ['#8B5CF6', 1.8, .5], ['#38BDF8', 1.1, .35]];
  svg.innerHTML = cols.map(([c, w, a], k) => {
    const ph = [0, .7, 1.5, 2.4][k]; let d = '';
    for (let i = 0; i <= 120; i++) {
      const t = i / 120, x = -20 + t * 1060;
      const y = 300 * (.62 + .22 * Math.sin(t * Math.PI * 1.3 + ph) - .42 * t * t) + 26 * Math.sin(t * 7 + ph * 2);
      d += (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
    }
    return `<path d="${d}" stroke="${c}" stroke-width="${w}" opacity="${a}" vector-effect="non-scaling-stroke"/>`;
  }).join('');
})();

/* =================== modo noturno =================== */
let nightOverride = 0;
function nightCheck(h = new Date().getHours()) {
  if (!CFG.night) return;
  const [a, b] = CFG.night;
  const isNight = a > b ? (h >= a || h < b) : (h >= a && h < b);
  document.body.classList.toggle('night', isNight && Date.now() > nightOverride);
}

/* =================== clima (Open-Meteo, sem chave) =================== */
const COND = {
  'sunny':'Ensolarado','clear-night':'Céu limpo','partlycloudy':'Parcialmente nublado','partlycloudy-night':'Parcialmente nublado',
  'cloudy':'Nublado','fog':'Neblina','rainy':'Chuva','pouring':'Chuva forte','lightning-rainy':'Tempestade',
  'snowy':'Neve','snowy-rainy':'Neve e chuva','hail':'Granizo'
};
function wmo(code, day = true) {
  if (code === 0) return day ? 'sunny' : 'clear-night';
  if (code === 1 || code === 2) return day ? 'partlycloudy' : 'partlycloudy-night';
  if (code === 3) return 'cloudy';
  if (code === 45 || code === 48) return 'fog';
  if ([65, 82].includes(code)) return 'pouring';
  if ((code >= 51 && code <= 63) || code === 80 || code === 81) return 'rainy';
  if (code === 66 || code === 67) return 'snowy-rainy';
  if ((code >= 71 && code <= 77) || code === 85 || code === 86) return 'snowy';
  if (code === 95) return 'lightning-rainy';
  if (code === 96 || code === 99) return 'hail';
  return 'cloudy';
}
const COND_WMO = {1:'Predomínio de sol',2:'Parcialmente nublado',3:'Nublado',51:'Garoa',53:'Garoa',55:'Garoa forte',61:'Chuva fraca',63:'Chuva',80:'Pancadas de chuva',81:'Pancadas de chuva'};
const dirName = (deg) => ['N','NE','L','SE','S','SO','O','NO'][Math.round(deg / 45) % 8];

async function loadWeather() {
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${CFG.lat}&longitude=${CFG.lon}`
    + '&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,wind_direction_10m,is_day'
    + '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max'
    + '&timezone=America%2FSao_Paulo&forecast_days=6';
  try {
    const r = await fetch(url, { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    store.set('weather', data);
    renderWeather(data);
  } catch (e) {
    const cached = store.get('weather');
    if (cached) renderWeather(cached, true);
    else $('wCond').textContent = 'Clima indisponível';
  }
}

function renderWeather(d, stale = false) {
  const c = d.current, dl = d.daily;
  const key = wmo(c.weather_code, !!c.is_day);
  $('wIco').innerHTML = wIcon(key);
  $('wTemp').innerHTML = `${Math.round(c.temperature_2m)}<sup>°C</sup>`;
  $('wCond').textContent = (COND_WMO[c.weather_code] || COND[key]) + (stale ? ' ·' : '');
  $('wFeel').textContent = `Sensação ${Math.round(c.apparent_temperature)}°`;
  $('wCity').textContent = CFG.city;
  const stat = (ico, v, t) => `<div title="${t}">${ico}<span>${v}</span></div>`;
  $('wStats').innerHTML =
    stat(UI.up, Math.round(dl.temperature_2m_max[0]) + '°', 'Máxima') +
    stat(UI.down, Math.round(dl.temperature_2m_min[0]) + '°', 'Mínima') +
    stat(UI.hum, Math.round(c.relative_humidity_2m) + '%', 'Umidade') +
    stat(UI.wind, `${Math.round(c.wind_speed_10m)}<small style="font-weight:500;color:var(--dim)"> km/h ${dirName(c.wind_direction_10m)}</small>`, 'Vento');
  const days = $('wDays'); days.innerHTML = '';
  const short = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  for (let i = 1; i <= 5 && i < dl.time.length; i++) {
    const dt = new Date(dl.time[i] + 'T12:00:00');
    const pp = dl.precipitation_probability_max?.[i];
    days.insertAdjacentHTML('beforeend', `<div class="w-day">
      <span class="n">${i === 1 ? 'Amanhã' : short[dt.getDay()]}</span>
      <span class="ico">${wIcon(wmo(dl.weather_code[i]))}</span>
      <span><span class="mx">${Math.round(dl.temperature_2m_max[i])}°</span> <span class="mn">${Math.round(dl.temperature_2m_min[i])}°</span></span>
      <span class="pp">${pp >= 20 ? '💧' + pp + '%' : ''}</span></div>`);
  }
}

async function fetchJSON(url, ms = 12000) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), ms);
  try {
    const r = await fetch(url, { cache: 'no-cache', signal: ctl.signal });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}

async function loadFeedsConfig() {
  try { const f = await fetchJSON('feeds.json', 6000); if (Array.isArray(f) && f.length) FEEDS = f; } catch {}
  if (!Q.get('fontes') && !store.get('fontes', null)) enabled = new Set(FEEDS.map(f => f.id));
  renderChips();
}

/* 1) news.json gerado pelo GitHub Actions  2) reserva: rss2json direto do navegador */
async function loadNews() {
  for (const url of CFG.data) {
    try {
      const d = await fetchJSON(url);
      if (!d?.items?.length) continue;
      const age = Date.now() - Date.parse(d.generated);
      if (age > CFG.staleAfter && url !== CFG.data[CFG.data.length - 1]) { console.warn('dados antigos em', url); continue; }
      applyNews(d.items, d.generated, 'servidor');
      fillMissing(d.items, d.generated);   // fontes que o servidor não conseguiu (ex.: ESPN bloqueia o GitHub)
      return;
    } catch (e) { console.warn('falhou', url, e.message); }
  }
  try {
    const items = await viaRss2json();
    if (items.length) return applyNews(items, new Date().toISOString(), 'direto');
  } catch (e) { console.warn('rss2json', e); }
  const cached = store.get('news');
  if (cached?.items?.length) return applyNews(cached.items, cached.generated, 'cache');
  setStatus('err', 'Sem conexão com as fontes');
  if (!all.length) $('empty').innerHTML = '<div><h2>Não foi possível carregar</h2><div>Vou tentar de novo em instantes.</div></div>';
  setTimeout(loadNews, 60e3);
}

/* RSS direto pelo navegador: funciona para quem libera CORS (ESPN) */
async function viaDirect(f) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 10000);
  try {
    const r = await fetch(f.url, { signal: ctl.signal, cache: 'no-cache' });
    const xml = new DOMParser().parseFromString(await r.text(), 'text/xml');
    const txt = (n, sel) => (n.getElementsByTagName(sel)[0]?.textContent || '').trim();
    return [...xml.getElementsByTagName('item')].slice(0, 15).map(it => {
      const html = txt(it, 'description');
      const plain = new DOMParser().parseFromString(html, 'text/html').body.textContent.replace(/\s+/g, ' ').trim();
      const enc = it.getElementsByTagName('enclosure')[0];
      const d = Date.parse(txt(it, 'pubDate').replace(/ (EST|EDT)$/, m => m === ' EST' ? ' -0500' : ' -0400'));
      return { source: f.id, title: txt(it, 'title'), summary: plain === 'null' ? '' : plain.slice(0, 420), link: txt(it, 'link'),
        image: enc?.getAttribute('url') || (html.match(/<img[^>]+src=['"]([^'"]+)/i) || [])[1] || null,
        date: isNaN(d) ? null : new Date(Math.min(d, Date.now())).toISOString() };  // ESPN às vezes data no futuro
    }).filter(x => x.title && x.link);
  } finally { clearTimeout(t); }
}

async function fillMissing(items, gen) {
  const have = new Set(items.map(x => x.source));
  const missing = FEEDS.filter(f => !have.has(f.id));
  if (!missing.length) return;
  let extra = [];
  for (const f of missing) {
    try { extra = extra.concat(await viaDirect(f)); }
    catch { try { extra = extra.concat(await viaRss2json([f])); } catch {} }
  }
  if (extra.length) applyNews(items.concat(extra), gen, 'servidor');
}

async function viaRss2json(list = FEEDS) {
  const out = [];
  for (const f of list) {                     // em sequência e com pausa: o rss2json bloqueia rajadas
    try {
      const d = await fetchJSON('https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(f.url));
      if (d.status === 'ok') for (const it of d.items) {
        const html = it.description || it.content || '';
        const img = it.thumbnail || it.enclosure?.link || (html.match(/<img[^>]+src=['"]([^'"]+)/i) || [])[1] || null;
        const tmp = new DOMParser().parseFromString(html, 'text/html').body.textContent.replace(/\s+/g, ' ').trim();
        out.push({ source: f.id, title: it.title, summary: tmp === 'null' ? '' : tmp.slice(0, 420), link: it.link,
          image: img, date: it.pubDate ? new Date(it.pubDate.replace(' ', 'T') + 'Z').toISOString() : null });
      }
    } catch {}
    await new Promise(r => setTimeout(r, 1500));
  }
  return out;
}

function applyNews(items, gen, how) {
  const current = queue[idx]?.link;
  all = items.filter(x => x.title && x.link);
  generated = gen; source = how; lastOk = Date.now();
  if (how !== 'cache') store.set('news', { items: all, generated: gen });
  buildQueue(current);
  updateStatus();
}

/* intercala as fontes (a mais recente de cada uma primeiro), sem repetir a mesma fonte em sequência */
function buildQueue(keepLink) {
  const by = {};
  for (const x of all) if (enabled.has(x.source)) (by[x.source] ||= []).push(x);
  Object.values(by).forEach(l => l.sort((a, b) => (b.date || '').localeCompare(a.date || '')));
  const order = Object.keys(by).sort((a, b) => (by[b][0].date || '').localeCompare(by[a][0].date || ''));
  queue = [];
  for (let i = 0; order.some(s => by[s][i]); i++) for (const s of order) if (by[s][i]) queue.push(by[s][i]);
  const k = keepLink ? queue.findIndex(x => x.link === keepLink) : -1;
  idx = k >= 0 ? k : 0;
  if (!queue.length) { showEmpty('Nenhuma fonte selecionada', 'Toque nas fontes acima para ativar.'); return; }
  if (k < 0) show(idx, true); else { $('cnt').textContent = `${idx + 1} / ${queue.length}`; renderNext(); }
}

function showEmpty(t, s) {

  $('empty').hidden = false;

}

function ago(iso) {
  if (!iso) return '';
  const t = Date.parse(iso), m = Math.round((Date.now() - t) / 60000);
  if (m < 1) return 'agora';
  if (m < 60) return `há ${m} min`;
  const h = Math.round(m / 60);
  if (h < 24 && new Date(t).getDate() === new Date().getDate()) return `há ${h} h`;
  const d = new Date(t);
  const hm = d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  const y = new Date(); y.setDate(y.getDate() - 1);
  if (d.toDateString() === y.toDateString()) return `ontem, ${hm}`;
  return d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' }) + ', ' + hm;
}

function makeSlide(item) {
  const f = feedOf(item.source);
  const a = el('a', 'slide');
  a.href = item.link; a.target = '_blank'; a.rel = 'noopener';
  a.style.setProperty('--c', f.color);
  const ph = el('div', 'ph'); ph.append(el('span', '', f.name)); a.append(ph);
  if (item.image) {
    const blur = el('img', 'blur'); blur.alt = ''; blur.decoding = 'async';
    const pic = el('img', 'pic'); pic.alt = ''; pic.decoding = 'async';
    pic.onload = () => {
      // fotos muito estreitas/altas (ou miniaturas) ficam inteiras sobre o fundo desfocado
      const r = pic.naturalWidth / pic.naturalHeight, box = a.clientWidth / Math.max(1, a.clientHeight);
      if (pic.naturalWidth < 500 || r < box * .55 || r > box * 1.9) a.classList.add('contain');
      ph.remove();
    };
    pic.onerror = () => { pic.remove(); blur.remove(); };
    blur.onerror = () => blur.remove();
    pic.src = blur.src = item.image;
    a.append(blur, pic);
  }
  a.append(el('div', 'scrim'));
  const body = el('div', 'body');
  const meta = el('div', 'meta');
  const pill = el('span', 'pill', f.name);
  meta.append(pill);
  if (f.cat) meta.append(el('span', 'cat', f.cat));
  const ag = el('span', 'ago', ago(item.date)); ag.dataset.date = item.date || '';
  if (item.date) meta.append(ag);
  body.append(meta, el('h1', '', item.title));
  if (item.summary) body.append(el('p', '', item.summary));
  a.append(body);
  return a;
}

function show(i, instant = false) {
  if (!queue.length) return;
  idx = (i + queue.length) % queue.length;
  const item = queue[idx], hero = $('hero');
  $('empty').hidden = true;
  $('hud').hidden = $('counter').hidden = false;
  const old = [...hero.querySelectorAll('.slide')];
  const s = makeSlide(item);
  hero.insertBefore(s, $('counter'));
  requestAnimationFrame(() => requestAnimationFrame(() => s.classList.add('on')));
  old.forEach(o => { o.classList.remove('on'); setTimeout(() => o.remove(), instant ? 0 : 1000); });
  document.documentElement.style.setProperty('--accent', feedOf(item.source).color);
  $('cnt').textContent = `${idx + 1} / ${queue.length}`;
  renderNext();
  preload(queue[(idx + 1) % queue.length]);
  restartTimer();
}

function preload(item) { if (item?.image) { const im = new Image(); im.src = item.image; } }

function renderNext() {
  const list = $('nextList'); list.innerHTML = '';
  const n = Math.min(8, queue.length - 1);
  for (let k = 1; k <= n; k++) {
    const j = (idx + k) % queue.length, it = queue[j], f = feedOf(it.source);
    const b = el('button', 'ni'); b.style.setProperty('--c', f.color);
    b.onclick = () => show(j);
    const th = el('div', 'th');
    if (it.image) { const im = el('img'); im.alt = ''; im.loading = 'lazy'; im.src = it.image; im.onerror = () => im.remove(); th.append(im); }
    else th.style.background = `linear-gradient(135deg, ${f.color}55, #121840)`;
    const tx = el('div', 'tx'); const s = el('div', 's', f.name);
    if (it.date) s.append(el('span', '', '· ' + ago(it.date)));
    tx.append(s, el('div', 'h', it.title));
    b.append(th, tx); list.append(b);
  }
  fitNext();
}
/* mostra só os itens que cabem inteiros no cartão "A seguir" */
function fitNext() {
  const list = $('nextList');
  if (getComputedStyle(list).flexDirection !== 'column' || matchMedia('(max-width:599px)').matches) {
    [...list.children].forEach(c => c.style.display = ''); return;
  }
  [...list.children].forEach(c => { c.style.display = ''; });
  const bottom = list.getBoundingClientRect().bottom + 1;
  [...list.children].forEach(c => { if (c.getBoundingClientRect().bottom > bottom) c.style.display = 'none'; });
}

function restartTimer() {
  clearTimeout(timer);
  const p = $('prog'); p.classList.remove('run'); void p.offsetWidth; p.classList.add('run');
  if (!paused) timer = setTimeout(() => show(idx + 1), CFG.interval);
}
function setPaused(v) {
  paused = v;
  $('hero').classList.toggle('paused', v);
  $('icoPause').innerHTML = v ? UI.play : UI.pause;
  $('btnPause').setAttribute('aria-label', v ? 'Continuar' : 'Pausar');
  if (v) { clearTimeout(timer); timer = null; }
  else restartTimer();
}

/* =================== fontes (chips) =================== */
function renderChips() {
  const box = $('chips'); box.innerHTML = '';
  for (const f of FEEDS) {
    const b = el('button', 'chip'); b.style.setProperty('--c', f.color);
    b.setAttribute('aria-pressed', enabled.has(f.id));
    b.append(el('i'), document.createTextNode(f.name));
    b.onclick = () => {
      enabled.has(f.id) ? enabled.delete(f.id) : enabled.add(f.id);
      b.setAttribute('aria-pressed', enabled.has(f.id));
      store.set('fontes', [...enabled]);
      buildQueue(queue[idx]?.link);
      updateStatus();
    };
    box.append(b);
  }
}

/* =================== status =================== */
function setStatus(kind, text) { const s = $('status'); s.className = 'status ' + (kind || ''); s.querySelector('.txt').textContent = text; }
function updateStatus() {
  if (!generated) return;
  const age = Date.now() - Date.parse(generated);
  const how = source === 'cache' ? ' (offline)' : '';
  const n = queue.length;
  setStatus(!navigator.onLine || source === 'cache' ? 'err' : age > CFG.staleAfter ? 'warn' : '',
    `${n} notícias · atualizado ${ago(generated)}${how}`);
  document.querySelectorAll('.slide .ago').forEach(a => a.dataset.date && (a.textContent = ago(a.dataset.date)));
}

/* =================== interação: toque, deslize, teclado/controle remoto =================== */
$('btnPrev').onclick = (e) => { e.preventDefault(); show(idx - 1); };
$('btnNext').onclick = (e) => { e.preventDefault(); show(idx + 1); };
$('btnPause').onclick = (e) => { e.preventDefault(); setPaused(!paused); };

let sx = null, sy = 0, swiped = false;
$('hero').addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; swiped = false; });
$('hero').addEventListener('pointerup', e => {
  if (sx == null) return;
  const dx = e.clientX - sx, dy = e.clientY - sy;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.3) { swiped = true; show(idx + (dx < 0 ? 1 : -1)); }
  sx = null;
});
$('hero').addEventListener('click', e => { if (swiped) { e.preventDefault(); swiped = false; } }, true);

document.addEventListener('keydown', e => {
  const k = e.key;
  if (k === 'ArrowRight' || k === 'PageDown' || k === 'MediaTrackNext') { show(idx + 1); e.preventDefault(); }
  else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'MediaTrackPrevious') { show(idx - 1); e.preventDefault(); }
  else if (k === ' ' || k === 'MediaPlayPause' || k === 'p') { setPaused(!paused); e.preventDefault(); }
  else if ((k === 'Enter') && document.activeElement === document.body && queue[idx]) { window.open(queue[idx].link, '_blank', 'noopener'); }
});

/* toque na tela escura (madrugada) acende por 10 min */
document.addEventListener('pointerdown', () => {
  if (document.body.classList.contains('night')) { nightOverride = Date.now() + 10 * 60e3; nightCheck(); }
  requestWakeLock();
}, true);

/* =================== tela sempre ligada (Wake Lock) =================== */
let wakeLock = null;
async function requestWakeLock() {
  if (!('wakeLock' in navigator) || wakeLock || document.visibilityState !== 'visible') return;
  try { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => wakeLock = null); } catch {}
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    requestWakeLock();
    if (Date.now() - lastOk > CFG.newsEvery) loadNews();
    if (!paused) restartTimer();
  } else { clearTimeout(timer); }
});
addEventListener('online', () => { loadNews(); loadWeather(); });
addEventListener('offline', updateStatus);
/* o cartão "A seguir" muda de altura quando o clima carrega ou a tela gira: reajusta */
let rz; const refit = () => { clearTimeout(rz); rz = setTimeout(fitNext, 120); };
addEventListener('resize', refit);
if ('ResizeObserver' in window) new ResizeObserver(refit).observe($('nextList'));

/* =================== início =================== */
(async function start() {
  scheduleClock();
  document.fonts?.ready.then(fitNext);
  const cw = store.get('weather'); if (cw) try { renderWeather(cw, true); } catch {}
  renderChips();
  const cn = store.get('news'); if (cn?.items?.length) applyNews(cn.items, cn.generated, 'cache');
  loadWeather();
  await loadFeedsConfig();
  await loadNews();
  requestWakeLock();
  setInterval(loadNews, CFG.newsEvery);
  setInterval(loadWeather, CFG.weatherEvery);
  setInterval(updateStatus, 60e3);
  setTimeout(() => { if (navigator.onLine) location.reload(); }, CFG.reloadEvery);
})();
</script>
